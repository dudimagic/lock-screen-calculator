<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Red Blue Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  html, body { margin: 0; overflow: hidden; background: #808080; height: 100%; }
  .split {
    position: fixed;
    inset: 0;
    background: linear-gradient(90deg, #ff0000 0%, #ff0000 50%, #003cff 50%, #003cff 100%);
  }
  .note {
    position: fixed;
    top: 40%;
    left: 0; right: 0;
    text-align: center;
    font-family: -apple-system, sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 6px #000, 0 0 12px #000;
    padding: 0 20px;
  }
</style>
</head>
<body>
  <div class="split"></div>
  <div class="note">Take a screenshot of THIS exact image (side button + volume up), then use it as the lock screen wallpaper the same way you did with the checkerboard.</div>
</body>
</html>
