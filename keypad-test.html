<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<title>Keypad Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  :root {
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.62);
    --ink-faint: rgba(255,255,255,0.36);
    --dot-empty: rgba(255,255,255,0.9);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    overflow-x: hidden;
    background: #808080;
  }
  body {
    height: calc(100dvh + 200px);
    background-image: linear-gradient(90deg, #ff0000 0%, #ff0000 50%, #003cff 50%, #003cff 100%);
  }

  .screen {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    user-select: none;
  }
  .screen::after {
    content: "";
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(70% 35% at 50% 0%, rgba(0,0,0,0.18), transparent 60%);
    pointer-events: none;
  }

  .lockbody {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 26px;
    padding-top: 14px;
    padding-bottom: 112px;
  }

  .headline {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    padding: 10px 18px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.25);
  }

  .dots { display: flex; gap: 20px; height: 14px; align-items: center; direction: ltr; margin-top: -12px; margin-bottom: 22px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--dot-empty); background: transparent; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 76px);
    grid-auto-rows: 76px;
    gap: 22px;
    justify-content: center;
    direction: ltr;
  }
  .key {
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 400;
    backdrop-filter: blur(18px) brightness(1.25) saturate(70%);
    -webkit-backdrop-filter: blur(18px) brightness(1.25) saturate(70%);
    box-shadow: inset 0 1px 1.5px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.06);
  }
  .key.ghost { background: transparent; border-color: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }

  .keyrow-bottom {
    position: absolute;
    left: 0; right: 0;
    bottom: 6px;
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 280px;
    margin: 0 auto;
    padding: 6px 10px 2px;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    text-shadow: 0 1px 8px rgba(0,0,0,0.25);
  }

  .note {
    position: fixed;
    top: 6%;
    left: 0; right: 0;
    text-align: center;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 6px #000, 0 0 12px #000;
    padding: 0 20px;
    z-index: 50;
  }
</style>
<script>
  function centerScroll() { window.scrollTo(0, 100); }
  centerScroll();
  window.addEventListener('load', centerScroll);
  window.addEventListener('resize', centerScroll);
  [0, 50, 150, 400, 900, 1500].forEach(function (ms) { setTimeout(centerScroll, ms); });
</script>
</head>
<body>
  <div class="note">Real keypad UI + real scroll mechanism. Check status bar &amp; bottom bar for red/blue split. scrollY=<span id="sy">?</span></div>
  <div class="screen">
    <div class="lockbody">
      <div class="headline" lang="he">יש להזין את קוד הגישה</div>
      <div class="dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div class="keypad">
        <button class="key">1</button>
        <button class="key">2</button>
        <button class="key">3</button>
        <button class="key">4</button>
        <button class="key">5</button>
        <button class="key">6</button>
        <button class="key">7</button>
        <button class="key">8</button>
        <button class="key">9</button>
        <button class="key ghost"></button>
        <button class="key">0</button>
        <button class="key ghost"></button>
      </div>
      <div class="keyrow-bottom" lang="he">
        <span>שיחת חירום</span>
        <span>ביטול</span>
      </div>
    </div>
  </div>
  <script>
    setInterval(function () {
      var el = document.getElementById('sy');
      if (el) el.textContent = window.scrollY;
    }, 200);
  </script>
</body>
</html>
