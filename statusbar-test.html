<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Status Bar Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  html, body {
    margin: 0;
    overflow-x: hidden;
    background: #808080;
  }
  body {
    height: calc(100dvh + 200px);
    background-image:
      linear-gradient(45deg, #000 25%, transparent 25%),
      linear-gradient(-45deg, #000 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #000 75%),
      linear-gradient(-45deg, transparent 75%, #000 75%);
    background-size: 60px 60px;
    background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
    background-color: #fff;
  }
  .note {
    position: fixed;
    top: 40%;
    left: 0; right: 0;
    text-align: center;
    font-family: -apple-system, sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 6px #000, 0 0 12px #000;
    padding: 0 20px;
  }
</style>
<script>
  function centerScroll() { window.scrollTo(0, 100); }
  centerScroll();
  window.addEventListener('load', centerScroll);
  [0, 50, 150, 400, 900, 1500].forEach(function (ms) { setTimeout(centerScroll, ms); });
</script>
</head>
<body>
  <div class="note">If the checkerboard is unbroken through the very top status bar (clock/wifi/battery row), it's working. If that strip is a flat gray instead, it isn't.</div>
</body>
</html>
