<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Status Bar Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  html, body {
    margin: 0;
    overflow-x: hidden;
    background: #808080;
  }
  body {
    height: calc(100dvh + 200px);
    background-image: linear-gradient(90deg, #ff0000 0%, #ff0000 50%, #003cff 50%, #003cff 100%);
    background-color: #808080;
  }
  .note {
    position: fixed;
    top: 40%;
    left: 0; right: 0;
    text-align: center;
    font-family: -apple-system, sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 6px #000, 0 0 12px #000;
    padding: 0 20px;
  }
</style>
<script>
  function centerScroll() { window.scrollTo(0, 100); }
  centerScroll();
  window.addEventListener('load', centerScroll);
  [0, 50, 150, 400, 900, 1500].forEach(function (ms) { setTimeout(centerScroll, ms); });
</script>
</head>
<body>
  <div class="note">Left half red, right half blue, hard vertical line down the middle. If the status bar and bottom bar both show red-left/blue-right split too, it's working. If either is a single flat color (no split), it isn't.</div>
</body>
</html>
