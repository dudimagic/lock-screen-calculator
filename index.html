<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8" />
<title>נעילה</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<style>
  :root {
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.62);
    --ink-faint: rgba(255,255,255,0.36);
    --glass: rgba(255,255,255,0.16);
    --glass-press: rgba(255,255,255,0.34);
    --glass-border: rgba(255,255,255,0.14);
    --dot-empty: rgba(255,255,255,0.9);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000000;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }

  .screen {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    background:
      radial-gradient(55% 32% at 72% 5%, #6ea8ff 0%, transparent 62%),
      radial-gradient(65% 40% at 16% 18%, #3b6bef 0%, transparent 58%),
      radial-gradient(60% 42% at 84% 40%, #2447c4 0%, transparent 60%),
      radial-gradient(65% 38% at 22% 55%, #16297e 0%, transparent 58%),
      linear-gradient(180deg, #0a1442 0%, #071033 32%, #050a20 52%, #02040c 72%, #000000 92%);
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    user-select: none;
  }

  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(70% 35% at 50% 0%, rgba(0,0,0,0.18), transparent 60%);
    pointer-events: none;
  }

  /* passcode section — positions approved by user, do not adjust spacing/placement here */
  .lockbody {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 26px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 112px);
    transition: opacity 0.35s ease;
  }

  .headline {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 12px;
    cursor: default;
    text-shadow: 0 1px 10px rgba(0,0,0,0.25);
  }

  .dots {
    display: flex;
    gap: 20px;
    height: 14px;
    align-items: center;
    direction: ltr;
    margin-top: -12px;
    margin-bottom: 22px;
  }
  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--dot-empty);
    background: transparent;
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .dot.filled {
    background: var(--ink);
    border-color: var(--ink);
    transform: scale(1.05);
  }

  .dots.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }

  /* keypad */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 76px);
    grid-auto-rows: 76px;
    gap: 22px;
    justify-content: center;
    direction: ltr;
  }
  @media (max-width: 380px) {
    .keypad { grid-template-columns: repeat(3, 66px); grid-auto-rows: 66px; gap: 18px; }
  }
  @media (max-height: 700px) {
    .keypad { grid-template-columns: repeat(3, 62px); grid-auto-rows: 62px; gap: 14px; }
  }

  .key {
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(18px) brightness(1.25) saturate(70%);
    -webkit-backdrop-filter: blur(18px) brightness(1.25) saturate(70%);
    /* thin light-catching rim along the edge, not a full glossy face */
    box-shadow: inset 0 1px 1.5px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.06);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  /* brief confirmation flash used for secret-trigger feedback (e.g. the
     Cancel double-tap snapshot), shown on the 0 key instead of Cancel
     itself since a thumb pressing Cancel usually covers it */
  .key.pulse-trigger {
    background: rgba(255,255,255,0.14);
    box-shadow: inset 0 1px 1.5px rgba(255,255,255,0.5), 0 0 8px rgba(255,255,255,0.22);
  }
  /* strong solid white digit — only the button glass itself is tinted by the background */
  .key .num {
    color: #ffffff;
  }
  /* always reserved, even when empty, so digits without letters (1, 0) still
     align with the ones that have a two-line label underneath */
  .key .sub {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    height: 20px;
    margin-top: 2px;
  }
  .key .sub .he {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--ink-dim);
  }
  .key .sub .en {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--ink-faint);
  }
  .key:active { background: var(--glass-press); }
  .key.ghost { background: transparent; border-color: transparent; box-shadow: none; cursor: default; }

  /* position approved by user, do not adjust */
  .keyrow-bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
    z-index: 6;
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 280px;
    margin: 0 auto;
    padding: 6px 10px 2px;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    text-shadow: 0 1px 8px rgba(0,0,0,0.25);
  }
  .keyrow-bottom span { opacity: 0.92; cursor: pointer; transition: opacity 0.2s ease, text-shadow 0.2s ease; }
  .keyrow-bottom span.pulse-cancel {
    opacity: 1;
    text-shadow: 0 0 10px rgba(255,255,255,0.7);
  }
  /* subtle armed indicator — invisible until the leading-1 trigger is on.
     Uses the #armDot id selector so it reliably beats ".keyrow-bottom span"
     above (which would otherwise force opacity:0.92 on it regardless of state). */
  #armDot {
    opacity: 0;
    margin-left: 2px;
    font-weight: 700;
    transition: opacity 0.2s ease;
  }
  #armDot.show { opacity: 1; }

  /* result screen */
  .result {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 32px;
    opacity: 0;
    pointer-events: none;
    background:
      radial-gradient(55% 32% at 72% 5%, #6ea8ff 0%, transparent 62%),
      radial-gradient(65% 40% at 16% 18%, #3b6bef 0%, transparent 58%),
      radial-gradient(65% 38% at 22% 55%, #16297e 0%, transparent 58%),
      linear-gradient(180deg, #0a1442 0%, #071033 32%, #050a20 52%, #02040c 72%, #000000 92%);
    transition: opacity 0.5s ease;
  }
  .result.show { opacity: 1; pointer-events: auto; }

  .lockbody.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .result .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .result .value {
    font-size: 64px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    direction: ltr;
  }
  .result .formula {
    font-size: 14px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  .result button {
    margin-top: 26px;
    padding: 12px 26px;
    border-radius: 22px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: inherit;
  }
  .result button:active { background: var(--glass-press); }

  /* background settings sheet */
  .settings {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .settings.show { opacity: 1; pointer-events: auto; }

  .settings-card {
    width: min(320px, 86%);
    background: rgba(28,22,26,0.92);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  .settings-title {
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    color: var(--ink);
  }
  .settings-preview {
    height: 140px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--ink-faint);
    text-align: center;
    padding: 12px;
  }
  .settings-btn {
    display: block;
    text-align: center;
    padding: 12px 16px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-btn:active { background: var(--glass-press); }
  .settings-btn.ghost-btn { background: transparent; color: var(--ink-dim); border-color: transparent; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<div class="screen" id="screen">

  <div class="lockbody" id="lockbody">
    <div class="headline" id="headline" lang="he">יש להזין את קוד הגישה</div>
    <div class="dots" id="dots"></div>

    <div class="keypad" id="keypad">
      <!-- built by JS -->
    </div>

    <div class="keyrow-bottom" lang="he">
      <span id="emergency">שיחת חירום<span class="armdot" id="armDot">.</span></span>
      <span id="cancel">ביטול</span>
    </div>
  </div>

  <div class="result" id="result">
    <div class="eyebrow" id="resultEyebrow" lang="he">תוצאה</div>
    <div class="value" id="resultValue">0</div>
    <div class="formula" id="resultFormula">code &minus; 2026</div>
    <button id="againBtn" lang="he">נסה קוד אחר</button>
  </div>

  <div class="settings" id="settings">
    <div class="settings-card">
      <div class="settings-title">Lock Screen Background</div>
      <div class="settings-preview" id="settingsPreview">No custom image set</div>
      <label class="settings-btn" for="bgFileInput">Choose Photo</label>
      <input type="file" id="bgFileInput" accept="image/*" style="display:none" />
      <button class="settings-btn ghost-btn" id="removeBgBtn">Remove Background</button>
      <button class="settings-btn ghost-btn" id="closeSettingsBtn">Close</button>
    </div>
  </div>

</div>

<script>
  (function () {
    var digitMode = 6;
    var entered = "";
    var doubleTapWindow = 320;
    var lastTap = 0;
    var savedSubtrahend = null;
    var cancelLastTap = 0;
    var cancelDeleteTimer = null;
    var prependOne = false;
    var emergencyLastTap = 0;

    var dotsEl = document.getElementById("dots");
    var headlineEl = document.getElementById("headline");
    var keypadEl = document.getElementById("keypad");
    var resultEl = document.getElementById("result");
    var resultValueEl = document.getElementById("resultValue");
    var resultFormulaEl = document.getElementById("resultFormula");
    var lockbodyEl = document.getElementById("lockbody");
    var againBtn = document.getElementById("againBtn");
    var cancelEl = document.getElementById("cancel");
    var emergencyEl = document.getElementById("emergency");
    var armDotEl = document.getElementById("armDot");

    function updateArmIndicator() {
      armDotEl.classList.toggle("show", prependOne);
    }

    var zeroKeyEl = null;
    var oneKeyEl = null;
    var longPressTimer = null;
    var longPressFired = false;
    var addOneToResult = false;
    var LONG_PRESS_MS = 3000;

    function fireZeroFlash() {
      if (!zeroKeyEl) return;
      zeroKeyEl.classList.add("pulse-trigger");
      setTimeout(function () { zeroKeyEl.classList.remove("pulse-trigger"); }, 250);
    }

    var keys = [
      { d: "1" },
      { d: "2", he: "דהו", en: "ABC" },
      { d: "3", he: "אבג", en: "DEF" },
      { d: "4", he: "מנ", en: "GHI" },
      { d: "5", he: "יכל", en: "JKL" },
      { d: "6", he: "זחט", en: "MNO" },
      { d: "7", he: "רשת", en: "PQRS" },
      { d: "8", he: "צק", en: "TUV" },
      { d: "9", he: "סעפ", en: "WXYZ" },
      { ghost: true }, { d: "0", noSub: true }, { ghost: true }
    ];

    keys.forEach(function (k) {
      var btn = document.createElement("button");
      btn.className = "key" + (k.ghost ? " ghost" : "");
      if (k.ghost) {
        keypadEl.appendChild(btn);
        return;
      }
      // sub row is reserved (even empty) so 1 lines up with the lettered keys —
      // 0 skips it entirely so it sits dead-center in its circle
      var sub = k.noSub ? '' : '<span class="sub"><span class="he" lang="he">' + (k.he || "") + '</span><span class="en">' + (k.en || "") + '</span></span>';
      btn.innerHTML = '<span class="num">' + k.d + '</span>' + sub;
      btn.addEventListener("click", function () {
        // a completed long-press on "1" fires its own action instead
        // of entering the digit — swallow the click that follows it
        if (k.d === "1" && longPressFired) {
          longPressFired = false;
          return;
        }
        if (entered.length >= digitMode) return;
        entered += k.d;
        renderDots();
        if (entered.length === digitMode) {
          setTimeout(submit, 180);
        }
      });
      if (k.d === "0") zeroKeyEl = btn;
      if (k.d === "1") {
        oneKeyEl = btn;
        // secret gesture: hold "1" for 3 seconds to arm +1 on the
        // next calculated result, confirmed with the same 0-key flash
        var startLongPress = function () {
          longPressFired = false;
          clearTimeout(longPressTimer);
          longPressTimer = setTimeout(function () {
            longPressFired = true;
            addOneToResult = true;
            fireZeroFlash();
          }, LONG_PRESS_MS);
        };
        var cancelLongPress = function () {
          clearTimeout(longPressTimer);
        };
        btn.addEventListener("pointerdown", startLongPress);
        btn.addEventListener("pointerup", cancelLongPress);
        btn.addEventListener("pointercancel", cancelLongPress);
        btn.addEventListener("pointerleave", cancelLongPress);
      }
      keypadEl.appendChild(btn);
    });

    function renderDots() {
      dotsEl.innerHTML = "";
      for (var i = 0; i < digitMode; i++) {
        var d = document.createElement("div");
        d.className = "dot" + (i < entered.length ? " filled" : "");
        dotsEl.appendChild(d);
      }
    }

    function pad2(x) { return x < 10 ? "0" + x : "" + x; }

    function submit() {
      // if armed via double-tap on Emergency before entry, prepend a 1
      // to the typed code and calculate from that instead
      var codeStr = entered;
      if (prependOne) {
        codeStr = "1" + entered;
        prependOne = false;
        updateArmIndicator();
      }
      var n = parseInt(codeStr, 10);
      var subtrahend;
      if (savedSubtrahend !== null) {
        // use the time snapshot captured at the double-tap, even if a
        // minute or two has passed since then — consumed after this one use
        subtrahend = savedSubtrahend;
        savedSubtrahend = null;
      } else {
        var now = new Date();
        var hhmm = parseInt(pad2(now.getHours()) + pad2(now.getMinutes()), 10);
        var year = now.getFullYear();
        subtrahend = hhmm + year;
      }
      var result = n - subtrahend;
      if (addOneToResult) {
        // armed via a 3-second hold on "1" — adds 1 to the final
        // result itself, not to the entered code
        result += 1;
        addOneToResult = false;
      }
      var minusSign = String.fromCharCode(8722);
      resultValueEl.textContent = result;
      resultFormulaEl.textContent = codeStr + " " + minusSign + " " + subtrahend + " = " + result;
      resultEl.classList.add("show");
      lockbodyEl.classList.add("hidden");
    }

    function reset() {
      entered = "";
      renderDots();
      resultEl.classList.remove("show");
      lockbodyEl.classList.remove("hidden");
    }

    againBtn.addEventListener("click", reset);

    // "Cancel" doubles as delete since the keypad itself is digits-only.
    // A single tap deletes (after a short delay, to allow detecting a
    // second tap); a double-tap instead snapshots the current HHmm+year
    // so the calculation uses that saved moment even if the code is
    // typed a minute or two later. Confirmation flashes on the 0 key
    // instead of Cancel itself, since a thumb double-tapping Cancel
    // usually covers Cancel's own text.
    cancelEl.addEventListener("click", function () {
      var now = Date.now();
      if (now - cancelLastTap < doubleTapWindow) {
        clearTimeout(cancelDeleteTimer);
        cancelLastTap = 0;
        var d = new Date();
        var hhmm = parseInt(pad2(d.getHours()) + pad2(d.getMinutes()), 10);
        savedSubtrahend = hhmm + d.getFullYear();
        fireZeroFlash();
      } else {
        cancelLastTap = now;
        cancelDeleteTimer = setTimeout(function () {
          entered = entered.slice(0, -1);
          renderDots();
        }, doubleTapWindow);
      }
    });

    // secret gesture: double-tap "Emergency" to toggle arming a leading 1 —
    // while armed, a "." shows next to the word; the next completed code
    // gets a 1 prepended before the calculation (4444 -> 14444,
    // 006473 -> 1006473), then auto-disarms after that one use
    emergencyEl.addEventListener("click", function () {
      var now = Date.now();
      if (now - emergencyLastTap < doubleTapWindow) {
        emergencyLastTap = 0;
        prependOne = !prependOne;
        updateArmIndicator();
        emergencyEl.classList.add("pulse-cancel");
        setTimeout(function () { emergencyEl.classList.remove("pulse-cancel"); }, 250);
      } else {
        emergencyLastTap = now;
      }
    });

    // secret gesture: double-tap the Hebrew headline to switch 4/6 digit mode —
    // no visual feedback beyond the dot count itself changing
    headlineEl.addEventListener("click", function () {
      var now = Date.now();
      if (now - lastTap < doubleTapWindow) {
        digitMode = digitMode === 6 ? 4 : 6;
        entered = "";
        renderDots();
        lastTap = 0;
      } else {
        lastTap = now;
      }
    });

    renderDots();

    // ---- secret gesture: two-finger swipe down opens the background settings sheet ----
    var screenEl = document.getElementById("screen");
    var settingsEl = document.getElementById("settings");
    var settingsPreview = document.getElementById("settingsPreview");
    var bgFileInput = document.getElementById("bgFileInput");
    var removeBgBtn = document.getElementById("removeBgBtn");
    var closeSettingsBtn = document.getElementById("closeSettingsBtn");
    var BG_KEY = "lockscreen_bg_v1";

    function applyBackground(dataUrl) {
      if (dataUrl) {
        var img = "url(" + dataUrl + ")";
        screenEl.style.backgroundImage = "linear-gradient(rgba(0,0,0,0.32), rgba(0,0,0,0.32)), " + img;
        // mirrored onto <body> too, so if the viewport ever peeks past .screen
        // by a hairline, it shows the same photo instead of the fallback color
        document.body.style.backgroundImage = img;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
        settingsPreview.style.backgroundImage = img;
        settingsPreview.textContent = "";
      } else {
        screenEl.style.backgroundImage = "";
        document.body.style.backgroundImage = "";
        settingsPreview.style.backgroundImage = "";
        settingsPreview.textContent = "No custom image set";
      }
    }

    function openSettings() { settingsEl.classList.add("show"); }
    function closeSettings() { settingsEl.classList.remove("show"); }

    closeSettingsBtn.addEventListener("click", closeSettings);
    settingsEl.addEventListener("click", function (e) {
      if (e.target === settingsEl) closeSettings();
    });

    removeBgBtn.addEventListener("click", function () {
      try { localStorage.removeItem(BG_KEY); } catch (err) {}
      applyBackground(null);
    });

    bgFileInput.addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var maxDim = 1400;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var out = canvas.toDataURL("image/jpeg", 0.82);
          try { localStorage.setItem(BG_KEY, out); } catch (err) {}
          applyBackground(out);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    try {
      var saved = localStorage.getItem(BG_KEY);
      if (saved) applyBackground(saved);
    } catch (err) {}

    var gestureTracking = false;
    var gestureTriggered = false;
    var gestureStartY = 0;

    window.addEventListener("touchstart", function (e) {
      if (e.touches.length === 2) {
        gestureTracking = true;
        gestureTriggered = false;
        gestureStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      } else {
        gestureTracking = false;
      }
    }, { passive: true });

    window.addEventListener("touchmove", function (e) {
      if (!gestureTracking || gestureTriggered || e.touches.length !== 2) return;
      var curY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      if (curY - gestureStartY > 70) {
        gestureTriggered = true;
        openSettings();
      }
    }, { passive: true });

    window.addEventListener("touchend", function (e) {
      if (e.touches.length < 2) gestureTracking = false;
    }, { passive: true });
  })();
</script>
</body>
</html>
