<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8" />
<title>נעילה</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a0508" />
<style>
  :root {
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.62);
    --ink-faint: rgba(255,255,255,0.36);
    --glass: rgba(255,255,255,0.16);
    --glass-press: rgba(255,255,255,0.34);
    --glass-border: rgba(255,255,255,0.14);
    --dot-empty: rgba(255,255,255,0.32);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(60% 40% at 78% 8%, #f2694a 0%, transparent 60%),
      radial-gradient(70% 45% at 15% 30%, #d63f4a 0%, transparent 55%),
      radial-gradient(65% 50% at 85% 55%, #e2503f 0%, transparent 60%),
      radial-gradient(80% 55% at 10% 85%, #4a1030 0%, transparent 60%),
      radial-gradient(90% 60% at 90% 100%, #2a0a1c 0%, transparent 65%),
      linear-gradient(165deg, #7a2233 0%, #4c1522 42%, #1a0508 100%);
    display: flex;
    flex-direction: column;
    color: var(--ink);
    user-select: none;
  }

  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(70% 35% at 50% 0%, rgba(0,0,0,0.18), transparent 60%);
    pointer-events: none;
  }

  /* status bar */
  .statusbar {
    position: relative;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 22px 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
    direction: ltr;
  }
  .statusbar .left { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; }

  .idpill {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 7px;
    background: #000;
    padding: 6px 14px;
    border-radius: 17px;
    height: 22px;
  }
  .idpill svg { display: block; }

  /* clock */
  .clockwrap {
    flex: 0 0 auto;
    text-align: center;
    margin-top: 4px;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .clock {
    font-size: 80px;
    font-weight: 200;
    line-height: 1;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 24px rgba(0,0,0,0.3);
  }
  .date {
    margin-top: 6px;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    text-shadow: 0 1px 12px rgba(0,0,0,0.25);
  }

  /* passcode section */
  .lockbody {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 22px;
    padding-bottom: 22px;
  }

  .headline {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 12px;
    transition: background 0.25s ease, transform 0.25s ease;
    cursor: default;
    text-shadow: 0 1px 10px rgba(0,0,0,0.25);
  }
  .headline.pulse {
    background: rgba(255,255,255,0.14);
    transform: scale(1.04);
  }

  .modehint {
    position: relative;
    margin-top: -14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-faint);
    height: 14px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    letter-spacing: 0.4px;
  }
  .modehint.show { opacity: 1; transform: translateY(0); }

  .dots {
    display: flex;
    gap: 20px;
    height: 14px;
    align-items: center;
    direction: ltr;
  }
  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 1.5px solid var(--dot-empty);
    background: transparent;
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .dot.filled {
    background: var(--ink);
    border-color: var(--ink);
    transform: scale(1.05);
  }

  .dots.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }

  /* keypad */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 76px);
    grid-auto-rows: 76px;
    gap: 20px;
    justify-content: center;
    direction: ltr;
  }
  @media (max-width: 380px) {
    .keypad { grid-template-columns: repeat(3, 66px); grid-auto-rows: 66px; gap: 16px; }
  }
  @media (max-height: 700px) {
    .keypad { grid-template-columns: repeat(3, 62px); grid-auto-rows: 62px; gap: 12px; }
    .clock { font-size: 60px; }
  }

  .key {
    border: none;
    border-radius: 50%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .key .sub {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    margin-top: 3px;
  }
  .key .sub .he {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--ink-dim);
  }
  .key .sub .en {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--ink-faint);
  }
  .key:active { background: var(--glass-press); }
  .key.ghost { background: transparent; border-color: transparent; cursor: default; }

  .keyrow-bottom {
    position: relative;
    z-index: 6;
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    padding: 6px 10px 2px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    flex: 0 0 auto;
    text-shadow: 0 1px 8px rgba(0,0,0,0.25);
  }
  .keyrow-bottom span { opacity: 0.92; }

  .homebar {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  .homebar i {
    width: 134px;
    height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.85);
    display: block;
  }

  /* result screen */
  .result {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 32px;
    opacity: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 40% at 78% 8%, #f2694a 0%, transparent 60%),
      radial-gradient(70% 45% at 15% 30%, #d63f4a 0%, transparent 55%),
      radial-gradient(80% 55% at 10% 85%, #4a1030 0%, transparent 60%),
      linear-gradient(165deg, #7a2233 0%, #4c1522 42%, #1a0508 100%);
    transition: opacity 0.5s ease;
  }
  .result.show { opacity: 1; pointer-events: auto; }

  .clockwrap.hidden, .lockbody.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .result .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .result .value {
    font-size: 64px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    direction: ltr;
  }
  .result .formula {
    font-size: 14px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  .result button {
    margin-top: 26px;
    padding: 12px 26px;
    border-radius: 22px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: inherit;
  }
  .result button:active { background: var(--glass-press); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<div class="screen" id="screen">

  <div class="statusbar">
    <div class="left">
      <span id="battPct">82</span>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="2.5" stroke="white" stroke-opacity="0.6" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="white"/><rect x="22.5" y="4" width="1.7" height="4" rx="0.8" fill="white" fill-opacity="0.6"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 9.5a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8zM4.7 6.9a4.6 4.6 0 016.6 0l-1.2 1.2a2.9 2.9 0 00-4.2 0L4.7 6.9zM2 4.3a8.3 8.3 0 0112 0L12.8 5.5a6.6 6.6 0 00-9.6 0L2 4.3z" fill="white"/></svg>
    </div>
    <span id="statusTime">9:41</span>
  </div>

  <div class="idpill">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="1" y="1" width="22" height="22" rx="7" stroke="#7ee08a" stroke-width="1.6"/><circle cx="8.3" cy="10" r="1.3" fill="#7ee08a"/><circle cx="15.7" cy="10" r="1.3" fill="#7ee08a"/><path d="M9 15.5c.9.8 2 1.2 3 1.2s2.1-.4 3-1.2" stroke="#7ee08a" stroke-width="1.5" stroke-linecap="round"/></svg>
    <svg width="11" height="13" viewBox="0 0 14 16" fill="none"><rect x="1" y="7" width="12" height="8" rx="2" stroke="white" stroke-width="1.4"/><path d="M4 7V4.5a3 3 0 016 0V7" stroke="white" stroke-width="1.4"/></svg>
  </div>

  <div class="clockwrap" id="clockwrap">
    <div class="clock" id="clock">9:41</div>
    <div class="date" id="date">שבת, 25 ביולי</div>
  </div>

  <div class="lockbody" id="lockbody">
    <div>
      <div class="headline" id="headline" lang="he">יש להזין את קוד הגישה</div>
      <div class="modehint" id="modehint" lang="he">קוד בן 4 ספרות</div>
    </div>
    <div class="dots" id="dots"></div>

    <div class="keypad" id="keypad">
      <!-- built by JS -->
    </div>

    <div class="keyrow-bottom" lang="he">
      <span id="emergency">שיחת חירום</span>
      <span id="cancel">ביטול</span>
    </div>
  </div>

  <div class="result" id="result">
    <div class="eyebrow" id="resultEyebrow" lang="he">תוצאה</div>
    <div class="value" id="resultValue">0</div>
    <div class="formula" id="resultFormula">code &minus; 2026</div>
    <button id="againBtn" lang="he">נסה קוד אחר</button>
  </div>

  <div class="homebar"><i></i></div>
</div>

<script>
  (function () {
    var digitMode = 6;
    var entered = "";
    var doubleTapWindow = 320;
    var lastTap = 0;

    var dotsEl = document.getElementById("dots");
    var headlineEl = document.getElementById("headline");
    var modehintEl = document.getElementById("modehint");
    var keypadEl = document.getElementById("keypad");
    var resultEl = document.getElementById("result");
    var resultValueEl = document.getElementById("resultValue");
    var resultFormulaEl = document.getElementById("resultFormula");
    var lockbodyEl = document.getElementById("lockbody");
    var clockwrapEl = document.getElementById("clockwrap");
    var againBtn = document.getElementById("againBtn");

    var keys = [
      { d: "1", he: "", en: "" },
      { d: "2", he: "דהו", en: "ABC" },
      { d: "3", he: "אבג", en: "DEF" },
      { d: "4", he: "מנ", en: "GHI" },
      { d: "5", he: "יכל", en: "JKL" },
      { d: "6", he: "זחט", en: "MNO" },
      { d: "7", he: "רשת", en: "PQRS" },
      { d: "8", he: "צק", en: "TUV" },
      { d: "9", he: "סעפ", en: "WXYZ" },
      { ghost: true },
      { d: "0", he: "", en: "" },
      { del: true }
    ];

    var delBtn = null;

    keys.forEach(function (k) {
      var btn = document.createElement("button");
      btn.className = "key" + (k.ghost ? " ghost" : "");
      if (k.ghost) {
        keypadEl.appendChild(btn);
        return;
      }
      if (k.del) {
        delBtn = btn;
        btn.style.visibility = "hidden";
        btn.innerHTML = '<svg width="26" height="20" viewBox="0 0 26 20" fill="none"><path d="M9 1h14a2 2 0 012 2v14a2 2 0 01-2 2H9a2 2 0 01-1.5-.68L.8 10.7a1 1 0 010-1.4L7.5 1.68A2 2 0 019 1z" stroke="white" stroke-opacity="0.9" stroke-width="1.4"/><path d="M13.5 7l6 6M19.5 7l-6 6" stroke="white" stroke-opacity="0.9" stroke-width="1.4" stroke-linecap="round"/></svg>';
        btn.addEventListener("click", function () {
          entered = entered.slice(0, -1);
          renderDots();
        });
      } else {
        var sub = (k.he || k.en) ? '<span class="sub"><span class="he" lang="he">' + k.he + '</span><span class="en">' + k.en + '</span></span>' : '';
        btn.innerHTML = '<span>' + k.d + '</span>' + sub;
        btn.addEventListener("click", function () {
          if (entered.length >= digitMode) return;
          entered += k.d;
          renderDots();
          if (entered.length === digitMode) {
            setTimeout(submit, 180);
          }
        });
      }
      keypadEl.appendChild(btn);
    });

    function renderDots() {
      dotsEl.innerHTML = "";
      for (var i = 0; i < digitMode; i++) {
        var d = document.createElement("div");
        d.className = "dot" + (i < entered.length ? " filled" : "");
        dotsEl.appendChild(d);
      }
      if (delBtn) delBtn.style.visibility = entered.length > 0 ? "visible" : "hidden";
    }

    function submit() {
      var n = parseInt(entered, 10);
      var result = n - 2026;
      var minusSign = String.fromCharCode(8722);
      resultValueEl.textContent = result;
      resultFormulaEl.textContent = entered + " " + minusSign + " 2026 = " + result;
      resultEl.classList.add("show");
      clockwrapEl.classList.add("hidden");
      lockbodyEl.classList.add("hidden");
    }

    function reset() {
      entered = "";
      renderDots();
      resultEl.classList.remove("show");
      clockwrapEl.classList.remove("hidden");
      lockbodyEl.classList.remove("hidden");
    }

    againBtn.addEventListener("click", reset);

    // secret gesture: double-tap the Hebrew headline to switch 4/6 digit mode
    headlineEl.addEventListener("click", function () {
      var now = Date.now();
      if (now - lastTap < doubleTapWindow) {
        digitMode = digitMode === 6 ? 4 : 6;
        entered = "";
        renderDots();
        headlineEl.classList.add("pulse");
        modehintEl.textContent = digitMode === 4 ? "קוד בן 4 ספרות" : "קוד בן 6 ספרות";
        modehintEl.classList.add("show");
        setTimeout(function () { headlineEl.classList.remove("pulse"); }, 250);
        setTimeout(function () { modehintEl.classList.remove("show"); }, 1100);
        lastTap = 0;
      } else {
        lastTap = now;
      }
    });

    renderDots();

    // live clock
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    var heDays = ["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","יום שישי","שבת"];
    var heMonths = ["בינואר","בפברואר","במרץ","באפריל","במאי","ביוני","ביולי","באוגוסט","בספטמבר","באוקטובר","בנובמבר","בדצמבר"];
    function updateClock() {
      var now = new Date();
      var h = now.getHours();
      var timeStr = h + ":" + pad(now.getMinutes());
      document.getElementById("clock").textContent = timeStr;
      document.getElementById("statusTime").textContent = timeStr;
      document.getElementById("date").textContent = heDays[now.getDay()] + ", " + now.getDate() + " " + heMonths[now.getMonth()];
    }
    updateClock();
    setInterval(updateClock, 1000 * 10);
  })();
</script>
</body>
</html>
