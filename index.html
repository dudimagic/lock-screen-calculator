<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<title>Keypad Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  :root {
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.62);
    --ink-faint: rgba(255,255,255,0.36);
    --dot-empty: rgba(255,255,255,0.9);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    overflow-x: hidden;
    background: #808080;
  }
  body {
    height: calc(100dvh + 200px);
    background-image: linear-gradient(90deg, #ff0000 0%, #ff0000 50%, #003cff 50%, #003cff 100%);
  }

  .screen {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    user-select: none;
  }
  .screen::after {
    content: "";
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(70% 35% at 50% 0%, rgba(0,0,0,0.18), transparent 60%);
    pointer-events: none;
  }

  .lockbody {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 26px;
    padding-top: 14px;
    padding-bottom: 112px;
  }

  .headline {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    padding: 10px 18px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.25);
  }

  .dots { display: flex; gap: 20px; height: 14px; align-items: center; direction: ltr; margin-top: -12px; margin-bottom: 22px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--dot-empty); background: transparent; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 76px);
    grid-auto-rows: 76px;
    gap: 22px;
    justify-content: center;
    direction: ltr;
  }
  .key {
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 400;
    backdrop-filter: blur(18px) brightness(1.25) saturate(70%);
    -webkit-backdrop-filter: blur(18px) brightness(1.25) saturate(70%);
    box-shadow: inset 0 1px 1.5px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.06);
  }
  .key.ghost { background: transparent; border-color: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }

  .keyrow-bottom {
    position: absolute;
    left: 0; right: 0;
    bottom: 6px;
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 280px;
    margin: 0 auto;
    padding: 6px 10px 2px;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    text-shadow: 0 1px 8px rgba(0,0,0,0.25);
  }

  .settings {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .settings.show { opacity: 1; pointer-events: auto; }
  .settings-card {
    width: min(84vw, 360px);
    padding: 22px;
    border-radius: 20px;
    background: rgba(28,22,26,0.92);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
  }
  .settings-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: rgba(255,255,255,0.14);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
  }
  .settings-btn:active { background: rgba(255,255,255,0.28); }
</style>
<script>
  function centerScroll() { window.scrollTo(0, 100); }
  centerScroll();
  window.addEventListener('load', centerScroll);
  window.addEventListener('resize', centerScroll);
  [0, 50, 150, 400, 900, 1500].forEach(function (ms) { setTimeout(centerScroll, ms); });
</script>
</head>
<body>
  <div class="screen">
    <div class="lockbody">
      <div class="headline" lang="he">יש להזין את קוד הגישה</div>
      <div class="dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div class="keypad">
        <button class="key">1</button>
        <button class="key">2</button>
        <button class="key">3</button>
        <button class="key">4</button>
        <button class="key">5</button>
        <button class="key">6</button>
        <button class="key">7</button>
        <button class="key">8</button>
        <button class="key">9</button>
        <button class="key ghost"></button>
        <button class="key">0</button>
        <button class="key ghost"></button>
      </div>
      <div class="keyrow-bottom" lang="he">
        <span>שיחת חירום</span>
        <span>ביטול</span>
      </div>
    </div>

    <div class="settings" id="settings">
      <div class="settings-card">
        <button class="settings-btn" id="pasteBgBtn">Paste Image from Clipboard</button>
      </div>
    </div>
  </div>
  <script>
    var settingsEl = document.getElementById("settings");
    var pasteBgBtn = document.getElementById("pasteBgBtn");

    function openSettings() { settingsEl.classList.add("show"); }
    function closeSettings() { settingsEl.classList.remove("show"); }
    settingsEl.addEventListener("click", function (e) {
      if (e.target === settingsEl) closeSettings();
    });

    // secret gesture: two-finger swipe down opens the paste panel
    var gestureTracking = false;
    var gestureTriggered = false;
    var gestureStartY = 0;
    window.addEventListener("touchstart", function (e) {
      if (e.touches.length === 2) {
        gestureTracking = true;
        gestureTriggered = false;
        gestureStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      } else {
        gestureTracking = false;
      }
    }, { passive: true });
    window.addEventListener("touchmove", function (e) {
      if (!gestureTracking || gestureTriggered || e.touches.length !== 2) return;
      var curY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      if (curY - gestureStartY > 70) {
        gestureTriggered = true;
        openSettings();
      }
    }, { passive: true });
    window.addEventListener("touchend", function (e) {
      if (e.touches.length < 2) gestureTracking = false;
    }, { passive: true });

    function applyBackgroundImage(dataUrl) {
      document.body.style.backgroundImage = dataUrl;
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      try { localStorage.setItem("lockscreen_bg_v1", dataUrl); } catch (err) {}
    }

    function processBackgroundImageFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var maxDim = 1400;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          applyBackgroundImage("url(" + canvas.toDataURL("image/jpeg", 0.82) + ")");
          closeSettings();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    pasteBgBtn.addEventListener("click", function () {
      if (!navigator.clipboard || !navigator.clipboard.read) {
        alert("Clipboard access isn't available in this browser.");
        return;
      }
      navigator.clipboard.read().then(function (items) {
        for (var i = 0; i < items.length; i++) {
          var type = items[i].types.filter(function (t) { return t.indexOf("image/") === 0; })[0];
          if (type) {
            items[i].getType(type).then(processBackgroundImageFile);
            return;
          }
        }
        alert("No image found on the clipboard. Copy a photo first, then try again.");
      }).catch(function () {
        alert("Couldn't read the clipboard. Make sure you copied an image, then try again.");
      });
    });

    try {
      var saved = localStorage.getItem("lockscreen_bg_v1");
      if (saved) applyBackgroundImage(saved);
    } catch (err) {}
  </script>
</body>
</html>
