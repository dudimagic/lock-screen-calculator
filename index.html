<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8" />
<title>נעילה</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a0508" />
<style>
  :root {
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.62);
    --ink-faint: rgba(255,255,255,0.36);
    --glass: rgba(255,255,255,0.16);
    --glass-press: rgba(255,255,255,0.34);
    --glass-border: rgba(255,255,255,0.14);
    --dot-empty: rgba(255,255,255,0.32);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
    background:
      radial-gradient(60% 40% at 78% 8%, #f2694a 0%, transparent 60%),
      radial-gradient(70% 45% at 15% 30%, #d63f4a 0%, transparent 55%),
      radial-gradient(65% 50% at 85% 55%, #e2503f 0%, transparent 60%),
      radial-gradient(80% 55% at 10% 85%, #4a1030 0%, transparent 60%),
      radial-gradient(90% 60% at 90% 100%, #2a0a1c 0%, transparent 65%),
      linear-gradient(165deg, #7a2233 0%, #4c1522 42%, #1a0508 100%);
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    user-select: none;
  }

  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(70% 35% at 50% 0%, rgba(0,0,0,0.18), transparent 60%);
    pointer-events: none;
  }

  /* status bar */
  .statusbar {
    position: relative;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 22px 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
    direction: ltr;
  }
  .statusbar .left { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; }

  .idpill {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 7px;
    background: #000;
    padding: 6px 14px;
    border-radius: 17px;
    height: 22px;
  }
  .idpill svg { display: block; }

  /* passcode section */
  .lockbody {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 26px;
    padding-bottom: 22px;
    transition: opacity 0.35s ease;
  }

  .headline {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 12px;
    transition: background 0.25s ease, transform 0.25s ease;
    cursor: default;
    text-shadow: 0 1px 10px rgba(0,0,0,0.25);
  }
  .headline.pulse {
    background: rgba(255,255,255,0.14);
    transform: scale(1.04);
  }

  .modehint {
    position: relative;
    margin-top: -18px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-faint);
    height: 14px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    letter-spacing: 0.4px;
  }
  .modehint.show { opacity: 1; transform: translateY(0); }

  .dots {
    display: flex;
    gap: 20px;
    height: 14px;
    align-items: center;
    direction: ltr;
  }
  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 1.5px solid var(--dot-empty);
    background: transparent;
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .dot.filled {
    background: var(--ink);
    border-color: var(--ink);
    transform: scale(1.05);
  }

  .dots.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }

  /* keypad */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 76px);
    grid-auto-rows: 76px;
    gap: 22px;
    justify-content: center;
    direction: ltr;
  }
  @media (max-width: 380px) {
    .keypad { grid-template-columns: repeat(3, 66px); grid-auto-rows: 66px; gap: 18px; }
  }
  @media (max-height: 700px) {
    .keypad { grid-template-columns: repeat(3, 62px); grid-auto-rows: 62px; gap: 14px; }
  }

  .key {
    border: none;
    border-radius: 50%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .key:active { background: var(--glass-press); }
  .key.ghost { background: transparent; border-color: transparent; cursor: default; }

  .keyrow-bottom {
    position: relative;
    z-index: 6;
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    padding: 6px 10px 2px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    flex: 0 0 auto;
    text-shadow: 0 1px 8px rgba(0,0,0,0.25);
  }
  .keyrow-bottom span { opacity: 0.92; cursor: pointer; }

  .homebar {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  .homebar i {
    width: 134px;
    height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.85);
    display: block;
  }

  /* result screen */
  .result {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 32px;
    opacity: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 40% at 78% 8%, #f2694a 0%, transparent 60%),
      radial-gradient(70% 45% at 15% 30%, #d63f4a 0%, transparent 55%),
      radial-gradient(80% 55% at 10% 85%, #4a1030 0%, transparent 60%),
      linear-gradient(165deg, #7a2233 0%, #4c1522 42%, #1a0508 100%);
    transition: opacity 0.5s ease;
  }
  .result.show { opacity: 1; pointer-events: auto; }

  .lockbody.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .result .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .result .value {
    font-size: 64px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    direction: ltr;
  }
  .result .formula {
    font-size: 14px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  .result button {
    margin-top: 26px;
    padding: 12px 26px;
    border-radius: 22px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: inherit;
  }
  .result button:active { background: var(--glass-press); }

  /* background settings sheet */
  .settings {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .settings.show { opacity: 1; pointer-events: auto; }

  .settings-card {
    width: min(320px, 86%);
    background: rgba(28,22,26,0.92);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  .settings-title {
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    color: var(--ink);
  }
  .settings-preview {
    height: 140px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--ink-faint);
    text-align: center;
    padding: 12px;
  }
  .settings-btn {
    display: block;
    text-align: center;
    padding: 12px 16px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-btn:active { background: var(--glass-press); }
  .settings-btn.ghost-btn { background: transparent; color: var(--ink-dim); border-color: transparent; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<div class="screen" id="screen">

  <div class="statusbar">
    <div class="left">
      <span id="battPct">82</span>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="2.5" stroke="white" stroke-opacity="0.6" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="white"/><rect x="22.5" y="4" width="1.7" height="4" rx="0.8" fill="white" fill-opacity="0.6"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 9.5a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8zM4.7 6.9a4.6 4.6 0 016.6 0l-1.2 1.2a2.9 2.9 0 00-4.2 0L4.7 6.9zM2 4.3a8.3 8.3 0 0112 0L12.8 5.5a6.6 6.6 0 00-9.6 0L2 4.3z" fill="white"/></svg>
    </div>
    <span id="statusTime">9:41</span>
  </div>

  <div class="idpill">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="1" y="1" width="22" height="22" rx="7" stroke="#7ee08a" stroke-width="1.6"/><circle cx="8.3" cy="10" r="1.3" fill="#7ee08a"/><circle cx="15.7" cy="10" r="1.3" fill="#7ee08a"/><path d="M9 15.5c.9.8 2 1.2 3 1.2s2.1-.4 3-1.2" stroke="#7ee08a" stroke-width="1.5" stroke-linecap="round"/></svg>
    <svg width="11" height="13" viewBox="0 0 14 16" fill="none"><rect x="1" y="7" width="12" height="8" rx="2" stroke="white" stroke-width="1.4"/><path d="M4 7V4.5a3 3 0 016 0V7" stroke="white" stroke-width="1.4"/></svg>
  </div>

  <div class="lockbody" id="lockbody">
    <div>
      <div class="headline" id="headline" lang="he">יש להזין את קוד הגישה</div>
      <div class="modehint" id="modehint" lang="he">קוד בן 4 ספרות</div>
    </div>
    <div class="dots" id="dots"></div>

    <div class="keypad" id="keypad">
      <!-- built by JS -->
    </div>

    <div class="keyrow-bottom" lang="he">
      <span id="emergency">שיחת חירום</span>
      <span id="cancel">ביטול</span>
    </div>
  </div>

  <div class="result" id="result">
    <div class="eyebrow" id="resultEyebrow" lang="he">תוצאה</div>
    <div class="value" id="resultValue">0</div>
    <div class="formula" id="resultFormula">code &minus; 2026</div>
    <button id="againBtn" lang="he">נסה קוד אחר</button>
  </div>

  <div class="homebar"><i></i></div>

  <div class="settings" id="settings">
    <div class="settings-card">
      <div class="settings-title">Lock Screen Background</div>
      <div class="settings-preview" id="settingsPreview">No custom image set</div>
      <label class="settings-btn" for="bgFileInput">Choose Photo</label>
      <input type="file" id="bgFileInput" accept="image/*" style="display:none" />
      <button class="settings-btn ghost-btn" id="removeBgBtn">Remove Background</button>
      <button class="settings-btn ghost-btn" id="closeSettingsBtn">Close</button>
    </div>
  </div>

</div>

<script>
  (function () {
    var digitMode = 6;
    var entered = "";
    var doubleTapWindow = 320;
    var lastTap = 0;

    var dotsEl = document.getElementById("dots");
    var headlineEl = document.getElementById("headline");
    var modehintEl = document.getElementById("modehint");
    var keypadEl = document.getElementById("keypad");
    var resultEl = document.getElementById("result");
    var resultValueEl = document.getElementById("resultValue");
    var resultFormulaEl = document.getElementById("resultFormula");
    var lockbodyEl = document.getElementById("lockbody");
    var againBtn = document.getElementById("againBtn");
    var cancelEl = document.getElementById("cancel");

    var keys = [
      { d: "1" }, { d: "2" }, { d: "3" },
      { d: "4" }, { d: "5" }, { d: "6" },
      { d: "7" }, { d: "8" }, { d: "9" },
      { ghost: true }, { d: "0" }, { ghost: true }
    ];

    keys.forEach(function (k) {
      var btn = document.createElement("button");
      btn.className = "key" + (k.ghost ? " ghost" : "");
      if (k.ghost) {
        keypadEl.appendChild(btn);
        return;
      }
      btn.textContent = k.d;
      btn.addEventListener("click", function () {
        if (entered.length >= digitMode) return;
        entered += k.d;
        renderDots();
        if (entered.length === digitMode) {
          setTimeout(submit, 180);
        }
      });
      keypadEl.appendChild(btn);
    });

    function renderDots() {
      dotsEl.innerHTML = "";
      for (var i = 0; i < digitMode; i++) {
        var d = document.createElement("div");
        d.className = "dot" + (i < entered.length ? " filled" : "");
        dotsEl.appendChild(d);
      }
    }

    function submit() {
      var n = parseInt(entered, 10);
      var result = n - 2026;
      var minusSign = String.fromCharCode(8722);
      resultValueEl.textContent = result;
      resultFormulaEl.textContent = entered + " " + minusSign + " 2026 = " + result;
      resultEl.classList.add("show");
      lockbodyEl.classList.add("hidden");
    }

    function reset() {
      entered = "";
      renderDots();
      resultEl.classList.remove("show");
      lockbodyEl.classList.remove("hidden");
    }

    againBtn.addEventListener("click", reset);

    // "Cancel" doubles as delete since the keypad itself is digits-only
    cancelEl.addEventListener("click", function () {
      entered = entered.slice(0, -1);
      renderDots();
    });

    // secret gesture: double-tap the Hebrew headline to switch 4/6 digit mode
    headlineEl.addEventListener("click", function () {
      var now = Date.now();
      if (now - lastTap < doubleTapWindow) {
        digitMode = digitMode === 6 ? 4 : 6;
        entered = "";
        renderDots();
        headlineEl.classList.add("pulse");
        modehintEl.textContent = digitMode === 4 ? "קוד בן 4 ספרות" : "קוד בן 6 ספרות";
        modehintEl.classList.add("show");
        setTimeout(function () { headlineEl.classList.remove("pulse"); }, 250);
        setTimeout(function () { modehintEl.classList.remove("show"); }, 1100);
        lastTap = 0;
      } else {
        lastTap = now;
      }
    });

    renderDots();

    // live status-bar clock
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    function updateClock() {
      var now = new Date();
      var timeStr = now.getHours() + ":" + pad(now.getMinutes());
      document.getElementById("statusTime").textContent = timeStr;
    }
    updateClock();
    setInterval(updateClock, 1000 * 10);

    // ---- secret gesture: two-finger swipe down opens the background settings sheet ----
    var screenEl = document.getElementById("screen");
    var settingsEl = document.getElementById("settings");
    var settingsPreview = document.getElementById("settingsPreview");
    var bgFileInput = document.getElementById("bgFileInput");
    var removeBgBtn = document.getElementById("removeBgBtn");
    var closeSettingsBtn = document.getElementById("closeSettingsBtn");
    var BG_KEY = "lockscreen_bg_v1";

    function applyBackground(dataUrl) {
      if (dataUrl) {
        screenEl.style.backgroundImage = "linear-gradient(rgba(0,0,0,0.32), rgba(0,0,0,0.32)), url(" + dataUrl + ")";
        settingsPreview.style.backgroundImage = "url(" + dataUrl + ")";
        settingsPreview.textContent = "";
      } else {
        screenEl.style.backgroundImage = "";
        settingsPreview.style.backgroundImage = "";
        settingsPreview.textContent = "No custom image set";
      }
    }

    function openSettings() { settingsEl.classList.add("show"); }
    function closeSettings() { settingsEl.classList.remove("show"); }

    closeSettingsBtn.addEventListener("click", closeSettings);
    settingsEl.addEventListener("click", function (e) {
      if (e.target === settingsEl) closeSettings();
    });

    removeBgBtn.addEventListener("click", function () {
      try { localStorage.removeItem(BG_KEY); } catch (err) {}
      applyBackground(null);
    });

    bgFileInput.addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var maxDim = 1400;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var out = canvas.toDataURL("image/jpeg", 0.82);
          try { localStorage.setItem(BG_KEY, out); } catch (err) {}
          applyBackground(out);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    try {
      var saved = localStorage.getItem(BG_KEY);
      if (saved) applyBackground(saved);
    } catch (err) {}

    var gestureTracking = false;
    var gestureTriggered = false;
    var gestureStartY = 0;

    window.addEventListener("touchstart", function (e) {
      if (e.touches.length === 2) {
        gestureTracking = true;
        gestureTriggered = false;
        gestureStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      } else {
        gestureTracking = false;
      }
    }, { passive: true });

    window.addEventListener("touchmove", function (e) {
      if (!gestureTracking || gestureTriggered || e.touches.length !== 2) return;
      var curY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      if (curY - gestureStartY > 70) {
        gestureTriggered = true;
        openSettings();
      }
    }, { passive: true });

    window.addEventListener("touchend", function (e) {
      if (e.touches.length < 2) gestureTracking = false;
    }, { passive: true });
  })();
</script>
</body>
</html>
