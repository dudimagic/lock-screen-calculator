<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<title>Keypad Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  :root {
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.62);
    --ink-faint: rgba(255,255,255,0.36);
    --glass: rgba(255,255,255,0.16);
    --glass-press: rgba(255,255,255,0.34);
    --glass-border: rgba(255,255,255,0.14);
    --dot-empty: rgba(255,255,255,0.9);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    overflow-x: hidden;
    background: #808080;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  body {
    height: calc(100dvh + 200px);
    background-image: linear-gradient(90deg, #ff0000 0%, #ff0000 50%, #003cff 50%, #003cff 100%);
  }

  .screen {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    user-select: none;
  }

  .lockbody {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 26px;
    padding-top: 14px;
    padding-bottom: 112px;
  }

  .headline {
    font-size: 22px;
    font-weight: 400;
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 12px;
    cursor: default;
    text-shadow: 0 1px 10px rgba(0,0,0,0.25);
  }

  .dots { display: flex; gap: 20px; height: 14px; align-items: center; direction: ltr; margin-top: -12px; margin-bottom: 22px; }
  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--dot-empty);
    background: transparent;
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .dot.filled {
    background: var(--ink);
    border-color: var(--ink);
    transform: scale(1.05);
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 76px);
    grid-auto-rows: 76px;
    gap: 22px;
    justify-content: center;
    direction: ltr;
  }
  @media (max-width: 380px) {
    .keypad { grid-template-columns: repeat(3, 66px); grid-auto-rows: 66px; gap: 18px; }
  }
  @media (max-height: 700px) {
    .keypad { grid-template-columns: repeat(3, 62px); grid-auto-rows: 62px; gap: 14px; }
  }

  .key {
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(18px) brightness(1.25) saturate(70%);
    -webkit-backdrop-filter: blur(18px) brightness(1.25) saturate(70%);
    box-shadow: inset 0 1px 1.5px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.06);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .key .num { color: #ffffff; }
  .key .sub {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    height: 20px;
    margin-top: 2px;
  }
  .key .sub .he {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--ink-dim);
  }
  .key .sub .en {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--ink-faint);
  }
  .key:active { background: var(--glass-press); }
  .key.ghost { background: transparent; border-color: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; cursor: default; }

  .keyrow-bottom {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 280px;
    margin: 0 auto;
    padding: 6px 10px 2px;
    font-size: 17px;
    font-weight: 400;
    color: var(--ink);
    text-shadow: 0 1px 8px rgba(0,0,0,0.25);
  }
  .keyrow-bottom span { opacity: 0.92; cursor: pointer; }
</style>
<script>
  function centerScroll() { window.scrollTo(0, 100); }
  centerScroll();
  window.addEventListener('load', centerScroll);
  window.addEventListener('resize', centerScroll);
  [0, 50, 150, 400, 900, 1500].forEach(function (ms) { setTimeout(centerScroll, ms); });
</script>
</head>
<body>
  <div class="screen">
    <div class="lockbody">
      <div class="headline" id="headline" lang="he">יש להזין את קוד הגישה</div>
      <div class="dots" id="dots"></div>
      <div class="keypad">
        <button class="key" data-d="1"><span class="num">1</span><span class="sub"></span></button>
        <button class="key" data-d="2"><span class="num">2</span><span class="sub"><span class="he" lang="he">דהו</span><span class="en">ABC</span></span></button>
        <button class="key" data-d="3"><span class="num">3</span><span class="sub"><span class="he" lang="he">אבג</span><span class="en">DEF</span></span></button>
        <button class="key" data-d="4"><span class="num">4</span><span class="sub"><span class="he" lang="he">מנ</span><span class="en">GHI</span></span></button>
        <button class="key" data-d="5"><span class="num">5</span><span class="sub"><span class="he" lang="he">יכל</span><span class="en">JKL</span></span></button>
        <button class="key" data-d="6"><span class="num">6</span><span class="sub"><span class="he" lang="he">זחט</span><span class="en">MNO</span></span></button>
        <button class="key" data-d="7"><span class="num">7</span><span class="sub"><span class="he" lang="he">רשת</span><span class="en">PQRS</span></span></button>
        <button class="key" data-d="8"><span class="num">8</span><span class="sub"><span class="he" lang="he">צק</span><span class="en">TUV</span></span></button>
        <button class="key" data-d="9"><span class="num">9</span><span class="sub"><span class="he" lang="he">סעפ</span><span class="en">WXYZ</span></span></button>
        <button class="key ghost"></button>
        <button class="key" data-d="0"><span class="num">0</span></button>
        <button class="key ghost"></button>
      </div>
      <div class="keyrow-bottom" lang="he">
        <span id="emergency">שיחת חירום</span>
        <span id="cancel">ביטול</span>
      </div>
    </div>
  </div>
  <script>
    var digitMode = 6;
    var entered = "";
    var dotsEl = document.getElementById("dots");
    var headlineEl = document.getElementById("headline");
    var cancelEl = document.getElementById("cancel");

    function renderDots() {
      dotsEl.innerHTML = "";
      for (var i = 0; i < digitMode; i++) {
        var d = document.createElement("div");
        d.className = "dot" + (i < entered.length ? " filled" : "");
        dotsEl.appendChild(d);
      }
    }
    renderDots();

    Array.prototype.forEach.call(document.querySelectorAll(".key[data-d]"), function (btn) {
      btn.addEventListener("click", function () {
        if (entered.length >= digitMode) return;
        entered += btn.getAttribute("data-d");
        renderDots();
        if (entered.length === digitMode) {
          setTimeout(function () { entered = ""; renderDots(); }, 900);
        }
      });
    });

    cancelEl.addEventListener("click", function () {
      entered = entered.slice(0, -1);
      renderDots();
    });

    // secret gesture: double-tap the headline to switch between 4 and 6
    // digit passcodes — no visual feedback beyond the dot count changing
    var lastHeadlineTap = 0;
    var doubleTapWindow = 320;
    headlineEl.addEventListener("click", function () {
      var now = Date.now();
      if (now - lastHeadlineTap < doubleTapWindow) {
        digitMode = digitMode === 6 ? 4 : 6;
        entered = "";
        renderDots();
        lastHeadlineTap = 0;
      } else {
        lastHeadlineTap = now;
      }
    });

    var emergencyEl = document.getElementById("emergency");

    // secret gesture: double-tap "Emergency Call" to paste the clipboard
    // image straight onto the wallpaper — no visible panel or button
    var lastEmergencyTap = 0;
    emergencyEl.addEventListener("click", function () {
      var now = Date.now();
      if (now - lastEmergencyTap < doubleTapWindow) {
        lastEmergencyTap = 0;
        triggerPaste();
      } else {
        lastEmergencyTap = now;
      }
    });

    function applyBackgroundImage(dataUrl) {
      document.body.style.backgroundImage = dataUrl;
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      try { localStorage.setItem("lockscreen_bg_v1", dataUrl); } catch (err) {}
    }

    function processBackgroundImageFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var maxDim = 1400;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          applyBackgroundImage("url(" + canvas.toDataURL("image/jpeg", 0.82) + ")");
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function triggerPaste() {
      if (!navigator.clipboard || !navigator.clipboard.read) {
        alert("Clipboard access isn't available in this browser.");
        return;
      }
      navigator.clipboard.read().then(function (items) {
        for (var i = 0; i < items.length; i++) {
          var type = items[i].types.filter(function (t) { return t.indexOf("image/") === 0; })[0];
          if (type) {
            items[i].getType(type).then(processBackgroundImageFile);
            return;
          }
        }
        alert("No image found on the clipboard. Copy a photo first, then try again.");
      }).catch(function () {
        alert("Couldn't read the clipboard. Make sure you copied an image, then try again.");
      });
    }

    try {
      var saved = localStorage.getItem("lockscreen_bg_v1");
      if (saved) applyBackgroundImage(saved);
    } catch (err) {}
  </script>
</body>
</html>
